<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Zhiheng Jin — AI Agent Safety and Evaluation</title>
  <desc id="desc">A dark technical banner with a risk-sensing network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#101b35"/>
      <stop offset="1" stop-color="#112d32"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity="0.08"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="1000" cy="126" r="240" fill="url(#glow)"/>

  <g fill="none" stroke="#5eead4" stroke-opacity="0.34" stroke-width="1.5">
    <path d="M900 44L1010 80L1112 50M900 44L930 148L1010 80L1064 158L1112 50M930 148L864 234L1000 214L1064 158L1144 238M1000 214L1144 238"/>
    <circle cx="900" cy="44" r="5" fill="#2dd4bf"/>
    <circle cx="1010" cy="80" r="7" fill="#818cf8"/>
    <circle cx="1112" cy="50" r="4" fill="#2dd4bf"/>
    <circle cx="930" cy="148" r="6" fill="#818cf8"/>
    <circle cx="1064" cy="158" r="9" fill="#2dd4bf" filter="url(#softGlow)"/>
    <circle cx="864" cy="234" r="4" fill="#2dd4bf"/>
    <circle cx="1000" cy="214" r="6" fill="#818cf8"/>
    <circle cx="1144" cy="238" r="5" fill="#2dd4bf"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="72" y="104" fill="#94a3b8" font-size="17" font-weight="600" letter-spacing="4">RESEARCH · BUILD · EVALUATE</text>
    <text x="68" y="178" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="1">ZHIHENG JIN</text>
    <rect x="72" y="201" width="520" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="244" fill="#cbd5e1" font-size="22" font-weight="500">AI Agent Safety · Evaluation · Statistical AI</text>
  </g>

  <g transform="translate(770 50)" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.9">
    <path d="M48 8L83 22V54C83 81 66 102 48 112C30 102 13 81 13 54V22L48 8Z"/>
    <path d="M33 57L43 67L65 43"/>
  </g>
</svg>
